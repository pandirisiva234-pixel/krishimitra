# Runs the whole system: PostgreSQL + FastAPI backend + React/Nginx frontend.
#   1. copy .env.docker.example to .env and fill it in
#   2. docker compose up -d --build
#   3. open http://localhost
# For HTTPS on a server, also use docker-compose.prod.yml (see docs/DEPLOYMENT.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: krishimitra
      POSTGRES_USER: krishimitra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishimitra -d krishimitra"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://krishimitra:${POSTGRES_PASSWORD}@db:5432/krishimitra
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      ENVIRONMENT: production
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
      PRELOAD_MODELS: "true"
    volumes:
      - storage:/app/storage                         # uploads and generated audio
      - ./knowledge_base:/app/knowledge_base         # ChromaDB + source PDFs (persisted on the host)
      - ./trained_models:/app/trained_models         # disease_model.onnx, intent model, model cache
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
  storage:
